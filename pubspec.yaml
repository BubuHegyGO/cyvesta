name: hegygo
description: "HegyGO - Hegyvidéki szállások és élmények alkalmazás"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_maps_flutter: ^2.18.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/default_accommodation.png
    - assets/images/szarvas.png
    - assets/images/quad.png
    - assets/images/csarda.png
    - assets/images/panorama.png
    - assets/images/cukraszda.png
    - assets/images/spa.png
    - assets/images/etterem.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true